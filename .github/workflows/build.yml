name: Build Realistic Floating Fish Overlay APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Complete Android Project Files
        run: |
          mkdir -p app/src/main/java/com/overlay/realisticfish
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle/wrapper

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RealisticFishOverlay"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # 4. App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.overlay.realisticfish'
              compileSdk 34

              defaultConfig {
                  applicationId "com.overlay.realisticfish"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="Realistic Fish Overlay"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FishOverlayService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Displays realistic animated decorative fish overlay on top of screen" />
                  </service>
              </application>
          </manifest>
          EOF

          # 6. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Realistic Fish Overlay</string>
          </resources>
          EOF

          # 7. activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F172A"
              android:padding="20dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:gravity="center_horizontal">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="ডিসপ্লে ফিশ ওভারলে (Live Fish)"
                      android:textColor="#F8FAFC"
                      android:textSize="22sp"
                      android:textStyle="bold"
                      android:layout_marginTop="24dp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="অন্যান্য অ্যাপ ব্যবহারের সময় স্ক্রিনের ওপর বাস্তবসম্মত বড় মাছ ভাসবে"
                      android:textColor="#94A3B8"
                      android:textSize="14sp"
                      android:gravity="center"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="28dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="#1E293B"
                      android:padding="18dp"
                      android:layout_marginBottom="20dp">

                      <TextView
                          android:id="@+id/tvFishCount"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="মাছের সংখ্যা: ৪টি"
                          android:textColor="#E2E8F0"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <SeekBar
                          android:id="@+id/seekFishCount"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:max="5"
                          android:progress="3"
                          android:layout_marginTop="8dp"
                          android:layout_marginBottom="18dp" />

                      <TextView
                          android:id="@+id/tvFishSize"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="মাছের সাইজ: বড় (১০০%)"
                          android:textColor="#E2E8F0"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <SeekBar
                          android:id="@+id/seekFishSize"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:max="60"
                          android:progress="30"
                          android:layout_marginTop="8dp"
                          android:layout_marginBottom="18dp" />

                      <TextView
                          android:id="@+id/tvFishSpeed"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="সাঁতারের গতি: স্বাভাবিক"
                          android:textColor="#E2E8F0"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <SeekBar
                          android:id="@+id/seekFishSpeed"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:max="100"
                          android:progress="40"
                          android:layout_marginTop="8dp" />
                  </LinearLayout>

                  <Button
                      android:id="@+id/btnStart"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="স্ক্রিনে মাছ চালু করুন (Start Overlay)"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:backgroundTint="#0EA5E9"
                      android:textColor="#FFFFFF"
                      android:layout_marginBottom="12dp" />

                  <Button
                      android:id="@+id/btnStop"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="বন্ধ করুন (Stop Overlay)"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:backgroundTint="#EF4444"
                      android:textColor="#FFFFFF" />

              </LinearLayout>
          </ScrollView>
          EOF

          # 8. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/overlay/realisticfish/MainActivity.kt
          package com.overlay.realisticfish

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private var fishCount = 4
              private var fishScale = 1.0f
              private var fishSpeed = 1.0f

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val prefs = getSharedPreferences("fish_prefs", Context.MODE_PRIVATE)
                  fishCount = prefs.getInt("count", 4)
                  fishScale = prefs.getFloat("scale", 1.0f)
                  fishSpeed = prefs.getFloat("speed", 1.0f)

                  val tvCount = findViewById<TextView>(R.id.tvFishCount)
                  val seekCount = findViewById<SeekBar>(R.id.seekFishCount)
                  val tvSize = findViewById<TextView>(R.id.tvFishSize)
                  val seekSize = findViewById<SeekBar>(R.id.seekFishSize)
                  val tvSpeed = findViewById<TextView>(R.id.tvFishSpeed)
                  val seekSpeed = findViewById<SeekBar>(R.id.seekFishSpeed)

                  seekCount.progress = fishCount - 1
                  tvCount.text = "মাছের সংখ্যা: ${fishCount}টি"

                  seekSize.progress = ((fishScale - 0.7f) * 100).toInt().coerceIn(0, 60)
                  tvSize.text = "মাছের সাইজ: ${(fishScale * 100).toInt()}%"

                  seekSpeed.progress = ((fishSpeed - 0.4f) * 60).toInt().coerceIn(0, 100)
                  tvSpeed.text = "সাঁতারের গতি: ${(fishSpeed * 100).toInt()}%"

                  seekCount.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          fishCount = progress + 1
                          tvCount.text = "মাছের সংখ্যা: ${fishCount}টি"
                          saveAndRefresh(prefs)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  seekSize.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          fishScale = 0.7f + (progress / 100f)
                          tvSize.text = "মাছের সাইজ: ${(fishScale * 100).toInt()}%"
                          saveAndRefresh(prefs)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  seekSpeed.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          fishSpeed = 0.4f + (progress / 60f)
                          tvSpeed.text = "সাঁতারের গতি: ${(fishSpeed * 100).toInt()}%"
                          saveAndRefresh(prefs)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      checkPermissionsAndStart()
                  }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      stopService(Intent(this, FishOverlayService::class.java))
                      Toast.makeText(this, "মাছ ওভারলে বন্ধ করা হয়েছে", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun saveAndRefresh(prefs: android.content.SharedPreferences) {
                  prefs.edit()
                      .putInt("count", fishCount)
                      .putFloat("scale", fishScale)
                      .putFloat("speed", fishSpeed)
                      .apply()
                  val updateIntent = Intent(this, FishOverlayService::class.java).apply {
                      action = "UPDATE_CONFIG"
                  }
                  if (Settings.canDrawOverlays(this)) {
                      try {
                          startService(updateIntent)
                      } catch (_: Exception) {}
                  }
              }

              private fun checkPermissionsAndStart() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED
                      ) {
                          ActivityCompat.requestPermissions(
                              this,
                              arrayOf(Manifest.permission.POST_NOTIFICATIONS),
                              101
                          )
                      }
                  }

                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(
                          this,
                          "অনুগ্রহ করে 'Display over other apps' অনুমতি দিন",
                          Toast.LENGTH_LONG
                      ).show()
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivityForResult(intent, 102)
                      return
                  }

                  startOverlayService()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 102 && Settings.canDrawOverlays(this)) {
                      startOverlayService()
                  }
              }

              private fun startOverlayService() {
                  val intent = Intent(this, FishOverlayService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
                  Toast.makeText(this, "স্ক্রিনে মাছ চালু হয়েছে!", Toast.LENGTH_SHORT).show()
              }
          }
          EOF

          # 9. FishOverlayService.kt
          cat << 'EOF' > app/src/main/java/com/overlay/realisticfish/FishOverlayService.kt
          package com.overlay.realisticfish

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat

          class FishOverlayService : Service() {

              private lateinit var windowManager: WindowManager
              private var fishView: RealisticFishOverlayView? = null
              private val CHANNEL_ID = "fish_overlay_channel"

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  startForeground(1, createNotification())

                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  fishView = RealisticFishOverlayView(this)
                  reloadPreferences()

                  val layoutFlag = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      layoutFlag,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START

                  windowManager.addView(fishView, params)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  reloadPreferences()
                  return START_STICKY
              }

              private fun reloadPreferences() {
                  val prefs = getSharedPreferences("fish_prefs", Context.MODE_PRIVATE)
                  val count = prefs.getInt("count", 4)
                  val scale = prefs.getFloat("scale", 1.0f)
                  val speed = prefs.getFloat("speed", 1.0f)
                  fishView?.updateSettings(count, scale, speed)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  fishView?.stopAnimation()
                  fishView?.let {
                      try {
                          windowManager.removeView(it)
                      } catch (_: Exception) {}
                  }
                  fishView = null
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Live Fish Screen Overlay",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }
              }

              private fun createNotification(): Notification {
                  val openIntent = Intent(this, MainActivity::class.java)
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, openIntent,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("স্ক্রিনে মাছ চলছে")
                      .setContentText("সেটিংস পরিবর্তন বা বন্ধ করতে ট্যাপ করুন")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
              }
          }
          EOF

          # 10. RealisticFishOverlayView.kt (18-Node Procedural Realistic Fish Engine)
          cat << 'EOF' > app/src/main/java/com/overlay/realisticfish/RealisticFishOverlayView.kt
          package com.overlay.realisticfish

          import android.content.Context
          import android.graphics.*
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import kotlin.math.*
          import kotlin.random.Random

          enum class FishSpecies {
              KOHAKU_KOI,
              SHOWA_KOI,
              ROYAL_BETTA,
              FANTAIL_GOLDFISH,
              SILVER_AROWANA
          }

          class RealisticFishOverlayView(context: Context) : View(context) {

              private val fishes = mutableListOf<RealisticFish>()
              private val handler = Handler(Looper.getMainLooper())
              private var isRunning = true
              private var lastTime = System.nanoTime()

              private var targetCount = 4
              private var fishScale = 1.0f
              private var speedMultiplier = 1.0f

              private val bodyPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val finPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val shadowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
                  color = Color.argb(42, 0, 15, 30)
              }
              private val detailPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }

              private val frameRunnable = object : Runnable {
                  override fun run() {
                      if (!isRunning) return
                      val now = System.nanoTime()
                      val dt = ((now - lastTime) / 1_000_000_000f).coerceIn(0.005f, 0.05f)
                      lastTime = now

                      updateFishes(dt)
                      invalidate()
                      handler.postDelayed(this, 16L)
                  }
              }

              init {
                  setLayerType(LAYER_TYPE_HARDWARE, null)
                  handler.post(frameRunnable)
              }

              fun updateSettings(count: Int, scale: Float, speed: Float) {
                  targetCount = count.coerceIn(1, 6)
                  fishScale = scale
                  speedMultiplier = speed
                  syncFishCount()
              }

              fun stopAnimation() {
                  isRunning = false
                  handler.removeCallbacks(frameRunnable)
              }

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  if (w > 0 && h > 0 && fishes.isEmpty()) {
                      syncFishCount()
                  }
              }

              private fun syncFishCount() {
                  val w = if (width > 0) width.toFloat() else 1080f
                  val h = if (height > 0) height.toFloat() else 2200f
                  val allSpecies = FishSpecies.values()

                  while (fishes.size < targetCount) {
                      val species = allSpecies[fishes.size % allSpecies.size]
                      fishes.add(RealisticFish(w, h, species))
                  }
                  while (fishes.size > targetCount) {
                      fishes.removeAt(fishes.size - 1)
                  }
              }

              private fun updateFishes(dt: Float) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return

                  for (fish in fishes) {
                      fish.update(dt, w, h, fishScale, speedMultiplier)
                  }
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  for (fish in fishes) {
                      fish.draw(canvas, bodyPaint, finPaint, shadowPaint, detailPaint, fishScale)
                  }
              }

              private class RealisticFish(screenW: Float, screenH: Float, val species: FishSpecies) {
                  var x = Random.nextFloat() * (screenW * 0.7f) + screenW * 0.15f
                  var y = Random.nextFloat() * (screenH * 0.7f) + screenH * 0.15f
                  var angle = Random.nextFloat() * (2f * PI.toFloat())
                  var targetAngle = angle
                  var swimPhase = Random.nextFloat() * 10f
                  var turnTimer = Random.nextFloat() * 3f + 1.5f

                  private val nodeCount = 18
                  private val spineX = FloatArray(nodeCount) { x }
                  private val spineY = FloatArray(nodeCount) { y }
                  private val spineAngles = FloatArray(nodeCount) { angle }

                  private val baseLength = when (species) {
                      FishSpecies.SILVER_AROWANA -> 340f
                      FishSpecies.KOHAKU_KOI -> 290f
                      FishSpecies.SHOWA_KOI -> 285f
                      FishSpecies.ROYAL_BETTA -> 240f
                      FishSpecies.FANTAIL_GOLDFISH -> 230f
                  }

                  fun update(dt: Float, w: Float, h: Float, scale: Float, speedMult: Float) {
                      val len = baseLength * scale
                      val segDist = len / nodeCount

                      turnTimer -= dt
                      if (turnTimer <= 0f) {
                          targetAngle += (Random.nextFloat() - 0.5f) * 2.1f
                          turnTimer = Random.nextFloat() * 3.5f + 1.8f
                      }

                      // Soft boundary steering so fish stay smoothly inside display
                      val margin = 130f * scale
                      if (x < margin || x > w - margin || y < margin + 80f || y > h - margin - 80f) {
                          val centerAngle = atan2((h * 0.5f - y), (w * 0.5f - x))
                          targetAngle = centerAngle + (Random.nextFloat() - 0.5f) * 0.5f
                      }

                      var diff = targetAngle - angle
                      while (diff > PI) diff -= (2f * PI).toFloat()
                      while (diff < -PI) diff += (2f * PI).toFloat()
                      angle += diff * (1.8f * dt)

                      val baseSpeed = when (species) {
                          FishSpecies.SILVER_AROWANA -> 145f
                          FishSpecies.KOHAKU_KOI, FishSpecies.SHOWA_KOI -> 125f
                          FishSpecies.ROYAL_BETTA -> 95f
                          FishSpecies.FANTAIL_GOLDFISH -> 105f
                      } * speedMult

                      swimPhase += dt * (5.2f * speedMult)
                      val headWobble = sin(swimPhase) * 0.045f
                      val moveAngle = angle + headWobble

                      x += cos(moveAngle) * baseSpeed * dt
                      y += sin(moveAngle) * baseSpeed * dt

                      spineX[0] = x
                      spineY[0] = y
                      spineAngles[0] = moveAngle

                      // 18-segment realistic spine wave propagation
                      for (i in 1 until nodeCount) {
                          val t = i.toFloat() / nodeCount
                          val waveAmp = (0.04f + t * t * 0.24f)
                          val waveOffset = sin(swimPhase - i * 0.42f) * waveAmp

                          val dx = spineX[i - 1] - spineX[i]
                          val dy = spineY[i - 1] - spineY[i]
                          val segAngle = atan2(dy, dx) + waveOffset * 0.35f

                          spineAngles[i] = segAngle
                          spineX[i] = spineX[i - 1] - cos(segAngle) * segDist
                          spineY[i] = spineY[i - 1] - sin(segAngle) * segDist
                      }
                  }

                  private fun bodyRadiusAt(t: Float, scale: Float): Float {
                      val maxHalfWidth = when (species) {
                          FishSpecies.FANTAIL_GOLDFISH -> 44f
                          FishSpecies.KOHAKU_KOI, FishSpecies.SHOWA_KOI -> 36f
                          FishSpecies.ROYAL_BETTA -> 27f
                          FishSpecies.SILVER_AROWANA -> 26f
                      } * scale

                      return when {
                          t < 0.22f -> maxHalfWidth * sin((t / 0.22f) * (PI.toFloat() / 2f)) * 0.92f
                          else -> {
                              val tailT = (t - 0.22f) / 0.78f
                              maxHalfWidth * (1f - tailT.pow(1.35f)) * 0.95f + 2f * scale
                          }
                      }
                  }

                  fun draw(
                      canvas: Canvas,
                      bodyPaint: Paint,
                      finPaint: Paint,
                      shadowPaint: Paint,
                      detailPaint: Paint,
                      scale: Float
                  ) {
                      // 1. Draw Soft 3D Floating Drop Shadow beneath the fish
                      drawFishBody(canvas, shadowPaint, scale, offsetX = 24f * scale, offsetY = 36f * scale, isShadow = true)

                      // 2. Draw Flowing Pectoral & Pelvic Fins
                      drawSideFins(canvas, finPaint, scale)

                      // 3. Draw Flowing Caudal Tail Fin
                      drawTailFin(canvas, finPaint, scale)

                      // 4. Draw Main Fish Body & Realistic Markings
                      drawFishBody(canvas, bodyPaint, scale, offsetX = 0f, offsetY = 0f, isShadow = false)

                      // 5. Draw Dorsal Fin Ridge, Eyes, Gill Lines & Barbels
                      drawHeadAndDorsalDetails(canvas, bodyPaint, detailPaint, scale)
                  }

                  private fun drawSideFins(canvas: Canvas, finPaint: Paint, scale: Float) {
                      val pIdx = 4
                      val px = spineX[pIdx]
                      val py = spineY[pIdx]
                      val pAng = spineAngles[pIdx]
                      val flap = sin(swimPhase * 0.85f) * 0.28f

                      val finColor = when (species) {
                          FishSpecies.KOHAKU_KOI -> Color.argb(185, 255, 245, 235)
                          FishSpecies.SHOWA_KOI -> Color.argb(190, 235, 235, 240)
                          FishSpecies.ROYAL_BETTA -> Color.argb(200, 225, 29, 72)
                          FishSpecies.FANTAIL_GOLDFISH -> Color.argb(185, 255, 190, 60)
                          FishSpecies.SILVER_AROWANA -> Color.argb(175, 210, 230, 245)
                      }
                      finPaint.color = finColor

                      val finLen = when (species) {
                          FishSpecies.ROYAL_BETTA -> 66f
                          FishSpecies.FANTAIL_GOLDFISH -> 56f
                          else -> 52f
                      } * scale

                      for (side in listOf(-1f, 1f)) {
                          val path = Path()
                          val baseR = bodyRadiusAt(pIdx.toFloat() / nodeCount, scale) * 0.7f
                          val sx = px + cos(pAng + side * (PI.toFloat() / 2f)) * baseR
                          val sy = py + sin(pAng + side * (PI.toFloat() / 2f)) * baseR

                          val sweepAngle = pAng + side * (1.15f + flap)
                          val tipX = sx + cos(sweepAngle) * finLen
                          val tipY = sy + sin(sweepAngle) * finLen

                          val backX = spineX[pIdx + 3] + cos(pAng + side * (PI.toFloat() / 2f)) * (baseR * 0.5f)
                          val backY = spineY[pIdx + 3] + sin(pAng + side * (PI.toFloat() / 2f)) * (baseR * 0.5f)

                          path.moveTo(sx, sy)
                          path.quadTo(
                              sx + cos(sweepAngle - side * 0.3f) * (finLen * 0.65f),
                              sy + sin(sweepAngle - side * 0.3f) * (finLen * 0.65f),
                              tipX,
                              tipY
                          )
                          path.quadTo(
                              (tipX + backX) * 0.5f,
                              (tipY + backY) * 0.5f,
                              backX,
                              backY
                          )
                          path.close()
                          canvas.drawPath(path, finPaint)
                      }
                  }

                  private fun drawTailFin(canvas: Canvas, finPaint: Paint, scale: Float) {
                      val tailIdx = nodeCount - 1
                      val tx = spineX[tailIdx]
                      val ty = spineY[tailIdx]
                      val tAng = spineAngles[tailIdx] + PI.toFloat()
                      val wave = sin(swimPhase - 3.2f) * 0.35f

                      val tailLen = when (species) {
                          FishSpecies.ROYAL_BETTA -> 115f
                          FishSpecies.FANTAIL_GOLDFISH -> 105f
                          FishSpecies.KOHAKU_KOI, FishSpecies.SHOWA_KOI -> 78f
                          FishSpecies.SILVER_AROWANA -> 68f
                      } * scale

                      val spread = when (species) {
                          FishSpecies.ROYAL_BETTA -> 0.85f
                          FishSpecies.FANTAIL_GOLDFISH -> 0.78f
                          else -> 0.52f
                      }

                      finPaint.color = when (species) {
                          FishSpecies.KOHAKU_KOI -> Color.argb(195, 255, 240, 230)
                          FishSpecies.SHOWA_KOI -> Color.argb(195, 40, 40, 48)
                          FishSpecies.ROYAL_BETTA -> Color.argb(215, 220, 38, 38)
                          FishSpecies.FANTAIL_GOLDFISH -> Color.argb(200, 251, 146, 60)
                          FishSpecies.SILVER_AROWANA -> Color.argb(190, 248, 113, 113)
                      }

                      val path = Path()
                      path.moveTo(tx, ty)
                      val topAng = tAng - spread + wave * 0.6f
                      val botAng = tAng + spread + wave * 0.6f
                      val midAng = tAng + wave

                      path.quadTo(
                          tx + cos(topAng) * (tailLen * 0.6f),
                          ty + sin(topAng) * (tailLen * 0.6f),
                          tx + cos(topAng) * tailLen,
                          ty + sin(topAng) * tailLen
                      )
                      path.quadTo(
                          tx + cos(midAng) * (tailLen * 0.85f),
                          ty + sin(midAng) * (tailLen * 0.85f),
                          tx + cos(botAng) * tailLen,
                          ty + sin(botAng) * tailLen
                      )
                      path.quadTo(
                          tx + cos(botAng) * (tailLen * 0.6f),
                          ty + sin(botAng) * (tailLen * 0.6f),
                          tx,
                          ty
                      )
                      path.close()
                      canvas.drawPath(path, finPaint)
                  }

                  private fun drawFishBody(
                      canvas: Canvas,
                      paint: Paint,
                      scale: Float,
                      offsetX: Float,
                      offsetY: Float,
                      isShadow: Boolean
                  ) {
                      val leftX = FloatArray(nodeCount)
                      val leftY = FloatArray(nodeCount)
                      val rightX = FloatArray(nodeCount)
                      val rightY = FloatArray(nodeCount)

                      for (i in 0 until nodeCount) {
                          val t = i.toFloat() / (nodeCount - 1)
                          val r = bodyRadiusAt(t, scale)
                          val perp = spineAngles[i] + (PI.toFloat() / 2f)
                          leftX[i] = spineX[i] + cos(perp) * r + offsetX
                          leftY[i] = spineY[i] + sin(perp) * r + offsetY
                          rightX[i] = spineX[i] - cos(perp) * r + offsetX
                          rightY[i] = spineY[i] - sin(perp) * r + offsetY
                      }

                      val bodyPath = Path()
                      // Snout tip
                      val snoutX = spineX[0] + cos(spineAngles[0]) * (14f * scale) + offsetX
                      val snoutY = spineY[0] + sin(spineAngles[0]) * (14f * scale) + offsetY
                      bodyPath.moveTo(snoutX, snoutY)

                      for (i in 0 until nodeCount) {
                          bodyPath.lineTo(leftX[i], leftY[i])
                      }
                      for (i in (nodeCount - 1) downTo 0) {
                          bodyPath.lineTo(rightX[i], rightY[i])
                      }
                      bodyPath.close()

                      if (!isShadow) {
                          paint.color = when (species) {
                              FishSpecies.KOHAKU_KOI -> Color.rgb(252, 250, 245)
                              FishSpecies.SHOWA_KOI -> Color.rgb(245, 245, 247)
                              FishSpecies.ROYAL_BETTA -> Color.rgb(29, 78, 216)
                              FishSpecies.FANTAIL_GOLDFISH -> Color.rgb(249, 115, 22)
                              FishSpecies.SILVER_AROWANA -> Color.rgb(203, 213, 225)
                          }
                      }
                      canvas.drawPath(bodyPath, paint)

                      if (isShadow) return

                      // Clip inside body to draw organic koi spots, metallic sheen, and scales
                      canvas.save()
                      canvas.clipPath(bodyPath)

                      when (species) {
                          FishSpecies.KOHAKU_KOI -> {
                              paint.color = Color.rgb(234, 67, 25)
                              canvas.drawCircle(spineX[2], spineY[2], 24f * scale, paint)
                              canvas.drawCircle(spineX[6], spineY[6], 34f * scale, paint)
                              canvas.drawCircle(spineX[11], spineY[11], 22f * scale, paint)
                          }
                          FishSpecies.SHOWA_KOI -> {
                              paint.color = Color.rgb(220, 38, 38)
                              canvas.drawCircle(spineX[3], spineY[3], 28f * scale, paint)
                              canvas.drawCircle(spineX[9], spineY[9], 30f * scale, paint)
                              paint.color = Color.rgb(24, 24, 27)
                              canvas.drawCircle(spineX[5] + 8f * scale, spineY[5], 20f * scale, paint)
                              canvas.drawCircle(spineX[12] - 6f * scale, spineY[12], 18f * scale, paint)
                          }
                          FishSpecies.ROYAL_BETTA -> {
                              paint.color = Color.argb(140, 147, 51, 234)
                              canvas.drawCircle(spineX[7], spineY[7], 36f * scale, paint)
                          }
                          FishSpecies.FANTAIL_GOLDFISH -> {
                              paint.color = Color.argb(160, 253, 224, 71)
                              canvas.drawCircle(spineX[5], spineY[5], 32f * scale, paint)
                          }
                          FishSpecies.SILVER_AROWANA -> {
                              paint.color = Color.argb(150, 248, 250, 252)
                              for (s in 3..14 step 2) {
                                  canvas.drawCircle(spineX[s], spineY[s], 18f * scale, paint)
                              }
                          }
                      }
                      canvas.restore()
                  }

                  private fun drawHeadAndDorsalDetails(
                      canvas: Canvas,
                      paint: Paint,
                      detailPaint: Paint,
                      scale: Float
                  ) {
                      // Dorsal fin spine ridge
                      detailPaint.color = when (species) {
                          FishSpecies.ROYAL_BETTA -> Color.argb(210, 244, 63, 94)
                          FishSpecies.SHOWA_KOI -> Color.argb(170, 30, 30, 35)
                          else -> Color.argb(150, 255, 255, 255)
                      }
                      detailPaint.strokeWidth = 5f * scale
                      detailPaint.strokeCap = Paint.Cap.ROUND

                      val dorsalPath = Path()
                      dorsalPath.moveTo(spineX[5], spineY[5])
                      for (i in 6..13) {
                          dorsalPath.lineTo(spineX[i], spineY[i])
                      }
                      canvas.drawPath(dorsalPath, detailPaint)

                      // Realistic Eyes on head segment
                      val headAngle = spineAngles[0]
                      val perp = headAngle + (PI.toFloat() / 2f)
                      val eyeDist = bodyRadiusAt(0.12f, scale) * 0.78f
                      val eyeForward = 4f * scale

                      for (side in listOf(-1f, 1f)) {
                          val ex = spineX[1] + cos(headAngle) * eyeForward + cos(perp) * (eyeDist * side)
                          val ey = spineY[1] + sin(headAngle) * eyeForward + sin(perp) * (eyeDist * side)

                          paint.color = Color.rgb(15, 23, 42)
                          canvas.drawCircle(ex, ey, 4.6f * scale, paint)

                          paint.color = Color.WHITE
                          canvas.drawCircle(ex + 1.2f * scale, ey - 1.2f * scale, 1.6f * scale, paint)
                      }

                      // Koi / Arowana Barbels (Whiskers)
                      if (species == FishSpecies.KOHAKU_KOI || species == FishSpecies.SHOWA_KOI || species == FishSpecies.SILVER_AROWANA) {
                          detailPaint.color = Color.argb(190, 245, 158, 11)
                          detailPaint.strokeWidth = 2.2f * scale
                          val snoutX = spineX[0] + cos(headAngle) * (12f * scale)
                          val snoutY = spineY[0] + sin(headAngle) * (12f * scale)

                          for (side in listOf(-1f, 1f)) {
                              val bAng = headAngle + side * 0.75f
                              canvas.drawLine(
                                  snoutX,
                                  snoutY,
                                  snoutX + cos(bAng) * (16f * scale),
                                  snoutY + sin(bAng) * (16f * scale),
                                  detailPaint
                              )
                          }
                      }
                  }
              }
          }
          EOF

      - name: Initialize Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realistic-Fish-Overlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

