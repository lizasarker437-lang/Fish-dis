name: Build Large Realistic Cat Overlay APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK 34 Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Complete Android Project Files
        run: |
          mkdir -p app/src/main/java/com/overlay/realisticcat
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LargeRealisticCatOverlay"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # 4. App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.overlay.realisticcat'
              compileSdk 34

              defaultConfig {
                  applicationId "com.overlay.realisticcat"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="Realistic Cat Overlay"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CatOverlayService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Displays a large realistic animated cat overlay on top of screen" />
                  </service>
              </application>
          </manifest>
          EOF

          # 6. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Realistic Cat Overlay</string>
          </resources>
          EOF

          # 7. activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F172A"
              android:padding="20dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:gravity="center_horizontal">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="বাস্তবসম্মত বড় বিড়াল ওভারলে"
                      android:textColor="#F8FAFC"
                      android:textSize="22sp"
                      android:textStyle="bold"
                      android:layout_marginTop="20dp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="ফোনের স্ক্রিনের ওপর একটি বড় বাস্তব বিড়াল হাঁটবে ও দুষ্টুমি করবে"
                      android:textColor="#94A3B8"
                      android:textSize="14sp"
                      android:gravity="center"
                      android:layout_marginTop="6dp"
                      android:layout_marginBottom="20dp" />

                  <!-- Cat Breed Selection Card -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="#1E293B"
                      android:padding="16dp"
                      android:layout_marginBottom="16dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="বিড়ালের ধরন বেছে নিন:"
                          android:textColor="#FBBF24"
                          android:textSize="15sp"
                          android:textStyle="bold"
                          android:layout_marginBottom="10dp" />

                      <RadioGroup
                          android:id="@+id/rgCatBreed"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">

                          <RadioButton
                              android:id="@+id/rbFluffyGinger"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="সোনালি-সাদা লোমশ মেইন কুন (Fluffy Ginger &amp; White)"
                              android:textColor="#F1F5F9"
                              android:textSize="15sp"
                              android:buttonTint="#F59E0B" />

                          <RadioButton
                              android:id="@+id/rbBrownTabby"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="ধূসর-বাদামী ডোরাকাটা ট্যাবি (Brown Striped Tabby)"
                              android:textColor="#F1F5F9"
                              android:textSize="15sp"
                              android:buttonTint="#38BDF8" />
                      </RadioGroup>
                  </LinearLayout>

                  <!-- Size and Speed Controls -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="#1E293B"
                      android:padding="16dp"
                      android:layout_marginBottom="20dp">

                      <TextView
                          android:id="@+id/tvCatSize"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="বিড়ালের আকার (Size): ১৩৫% (বড়)"
                          android:textColor="#E2E8F0"
                          android:textSize="15sp"
                          android:textStyle="bold" />

                      <SeekBar
                          android:id="@+id/seekCatSize"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:max="80"
                          android:progress="45"
                          android:layout_marginTop="6dp"
                          android:layout_marginBottom="16dp" />

                      <TextView
                          android:id="@+id/tvCatSpeed"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="দুষ্টুমি ও হাঁটার গতি: ১০০%"
                          android:textColor="#E2E8F0"
                          android:textSize="15sp"
                          android:textStyle="bold" />

                      <SeekBar
                          android:id="@+id/seekCatSpeed"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:max="100"
                          android:progress="36"
                          android:layout_marginTop="6dp" />
                  </LinearLayout>

                  <Button
                      android:id="@+id/btnStart"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="স্ক্রিনে বিড়াল চালু করুন (Start Cat)"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:backgroundTint="#10B981"
                      android:textColor="#FFFFFF"
                      android:layout_marginBottom="12dp" />

                  <Button
                      android:id="@+id/btnStop"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="বন্ধ করুন (Stop Cat)"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:backgroundTint="#EF4444"
                      android:textColor="#FFFFFF" />

              </LinearLayout>
          </ScrollView>
          EOF

          # 8. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/overlay/realisticcat/MainActivity.kt
          package com.overlay.realisticcat

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.RadioGroup
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private var catBreedIndex = 0 // 0 = Fluffy Ginger & White, 1 = Brown Striped Tabby
              private var catScale = 1.35f
              private var catSpeed = 1.0f

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val prefs = getSharedPreferences("cat_prefs", Context.MODE_PRIVATE)
                  catBreedIndex = prefs.getInt("breed", 0)
                  catScale = prefs.getFloat("scale", 1.35f)
                  catSpeed = prefs.getFloat("speed", 1.0f)

                  val rgBreed = findViewById<RadioGroup>(R.id.rgCatBreed)
                  val tvSize = findViewById<TextView>(R.id.tvCatSize)
                  val seekSize = findViewById<SeekBar>(R.id.seekCatSize)
                  val tvSpeed = findViewById<TextView>(R.id.tvCatSpeed)
                  val seekSpeed = findViewById<SeekBar>(R.id.seekCatSpeed)

                  if (catBreedIndex == 0) {
                      rgBreed.check(R.id.rbFluffyGinger)
                  } else {
                      rgBreed.check(R.id.rbBrownTabby)
                  }

                  seekSize.progress = ((catScale - 0.9f) * 100).toInt().coerceIn(0, 80)
                  tvSize.text = "বিড়ালের আকার (Size): ${(catScale * 100).toInt()}%"

                  seekSpeed.progress = ((catSpeed - 0.4f) * 60).toInt().coerceIn(0, 100)
                  tvSpeed.text = "দুষ্টুমি ও হাঁটার গতি: ${(catSpeed * 100).toInt()}%"

                  rgBreed.setOnCheckedChangeListener { _, checkedId ->
                      catBreedIndex = if (checkedId == R.id.rbFluffyGinger) 0 else 1
                      saveAndRefresh(prefs)
                  }

                  seekSize.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          catScale = 0.9f + (progress / 100f)
                          tvSize.text = "বিড়ালের আকার (Size): ${(catScale * 100).toInt()}%"
                          saveAndRefresh(prefs)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  seekSpeed.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          catSpeed = 0.4f + (progress / 60f)
                          tvSpeed.text = "দুষ্টুমি ও হাঁটার গতি: ${(catSpeed * 100).toInt()}%"
                          saveAndRefresh(prefs)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      checkPermissionsAndStart()
                  }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      stopService(Intent(this, CatOverlayService::class.java))
                      Toast.makeText(this, "বিড়াল ওভারলে বন্ধ করা হয়েছে", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun saveAndRefresh(prefs: android.content.SharedPreferences) {
                  prefs.edit()
                      .putInt("breed", catBreedIndex)
                      .putFloat("scale", catScale)
                      .putFloat("speed", catSpeed)
                      .apply()
                  val updateIntent = Intent(this, CatOverlayService::class.java).apply {
                      action = "UPDATE_CONFIG"
                  }
                  if (Settings.canDrawOverlays(this)) {
                      try {
                          startService(updateIntent)
                      } catch (_: Exception) {}
                  }
              }

              private fun checkPermissionsAndStart() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED
                      ) {
                          ActivityCompat.requestPermissions(
                              this,
                              arrayOf(Manifest.permission.POST_NOTIFICATIONS),
                              101
                          )
                      }
                  }

                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(
                          this,
                          "অনুগ্রহ করে 'Display over other apps' অনুমতি দিন",
                          Toast.LENGTH_LONG
                      ).show()
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      @Suppress("DEPRECATION")
                      startActivityForResult(intent, 102)
                      return
                  }

                  startOverlayService()
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 102 && Settings.canDrawOverlays(this)) {
                      startOverlayService()
                  }
              }

              private fun startOverlayService() {
                  val intent = Intent(this, CatOverlayService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
                  Toast.makeText(this, "স্ক্রিনে বড় বিড়াল চালু হয়েছে!", Toast.LENGTH_SHORT).show()
              }
          }
          EOF

          # 9. CatOverlayService.kt
          cat << 'EOF' > app/src/main/java/com/overlay/realisticcat/CatOverlayService.kt
          package com.overlay.realisticcat

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat

          class CatOverlayService : Service() {

              private lateinit var windowManager: WindowManager
              private var overlayView: SingleRealisticCatView? = null
              private val CHANNEL_ID = "single_realistic_cat_channel"

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  startForeground(1, createNotification())

                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  overlayView = SingleRealisticCatView(this)
                  reloadPreferences()

                  val layoutFlag = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      layoutFlag,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START

                  windowManager.addView(overlayView, params)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  reloadPreferences()
                  return START_STICKY
              }

              private fun reloadPreferences() {
                  val prefs = getSharedPreferences("cat_prefs", Context.MODE_PRIVATE)
                  val breedIdx = prefs.getInt("breed", 0)
                  val scale = prefs.getFloat("scale", 1.35f)
                  val speed = prefs.getFloat("speed", 1.0f)
                  overlayView?.updateSettings(breedIdx, scale, speed)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  overlayView?.stopAnimation()
                  overlayView?.let {
                      try {
                          windowManager.removeView(it)
                      } catch (_: Exception) {}
                  }
                  overlayView = null
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Realistic Cat Screen Overlay",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }
              }

              private fun createNotification(): Notification {
                  val openIntent = Intent(this, MainActivity::class.java)
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, openIntent,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("স্ক্রিনে বড় বিড়াল চলছে")
                      .setContentText("বিড়াল পরিবর্তন বা বন্ধ করতে ট্যাপ করুন")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
              }
          }
          EOF

          # 10. SingleRealisticCatView.kt (Single Large Photorealistic Cat Engine)
          cat << 'EOF' > app/src/main/java/com/overlay/realisticcat/SingleRealisticCatView.kt
          package com.overlay.realisticcat

          import android.content.Context
          import android.graphics.*
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import kotlin.math.*
          import kotlin.random.Random

          enum class CatBreed {
              FLUFFY_CREAM_GINGER,
              BROWN_STRIPED_TABBY
          }

          enum class CatMischief {
              STROLLING,          // Curious natural walking
              PAWING_GLASS,       // Tapping & scratching phone display with paw prints
              CHASING_YARN,       // Batting and chasing a red yarn ball
              PLAYFUL_ROLL,       // Rolling on back & wiggling paws/tail happily
              SITTING_GROOM       // Sitting calmly, breathing & twitching ears
          }

          class SingleRealisticCatView(context: Context) : View(context) {

              private var cat: LargeRealisticCat? = null
              private val pawPrints = mutableListOf<PawPrintEffect>()
              private var yarnBall: YarnBall? = null

              private val handler = Handler(Looper.getMainLooper())
              private var isRunning = true
              private var lastTime = System.nanoTime()

              private var selectedBreed = CatBreed.FLUFFY_CREAM_GINGER
              private var catScale = 1.35f
              private var speedMultiplier = 1.0f

              private val bodyPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val furPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val shadowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
                  color = Color.argb(56, 0, 10, 20)
              }
              private val detailPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }

              private val frameRunnable = object : Runnable {
                  override fun run() {
                      if (!isRunning) return
                      val now = System.nanoTime()
                      val dt = ((now - lastTime) / 1_000_000_000f).coerceIn(0.005f, 0.05f)
                      lastTime = now

                      updateWorld(dt)
                      invalidate()
                      handler.postDelayed(this, 16L)
                  }
              }

              init {
                  setLayerType(LAYER_TYPE_HARDWARE, null)
                  handler.post(frameRunnable)
              }

              fun updateSettings(breedIdx: Int, scale: Float, speed: Float) {
                  selectedBreed = if (breedIdx == 0) CatBreed.FLUFFY_CREAM_GINGER else CatBreed.BROWN_STRIPED_TABBY
                  catScale = scale
                  speedMultiplier = speed
                  cat?.breed = selectedBreed
              }

              fun stopAnimation() {
                  isRunning = false
                  handler.removeCallbacks(frameRunnable)
              }

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  if (w > 0 && h > 0) {
                      if (yarnBall == null) {
                          yarnBall = YarnBall(w * 0.5f, h * 0.6f)
                      }
                      if (cat == null) {
                          cat = LargeRealisticCat(w.toFloat(), h.toFloat(), selectedBreed)
                      }
                  }
              }

              private fun updateWorld(dt: Float) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return

                  if (cat == null) {
                      cat = LargeRealisticCat(w, h, selectedBreed)
                  }

                  val iter = pawPrints.iterator()
                  while (iter.hasNext()) {
                      val p = iter.next()
                      p.life -= dt
                      if (p.life <= 0f) iter.remove()
                  }

                  val currentCat = cat ?: return
                  val isChasingYarn = (currentCat.mischief == CatMischief.CHASING_YARN)
                  yarnBall?.update(dt, w, h, isChasingYarn, catScale)

                  currentCat.update(
                      dt = dt,
                      w = w,
                      h = h,
                      scale = catScale,
                      speedMult = speedMultiplier,
                      yarn = yarnBall,
                      onPawGlass = { px, py, ang, isGinger ->
                          if (pawPrints.size < 12) {
                              pawPrints.add(PawPrintEffect(px, py, ang, isGinger))
                          }
                      }
                  )
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)

                  for (p in pawPrints) {
                      p.draw(canvas, bodyPaint, detailPaint, catScale)
                  }

                  val currentCat = cat ?: return
                  if (currentCat.mischief == CatMischief.CHASING_YARN) {
                      yarnBall?.draw(canvas, bodyPaint, detailPaint, shadowPaint, catScale)
                  }

                  currentCat.draw(canvas, bodyPaint, furPaint, shadowPaint, detailPaint, catScale)
              }

              // =========================================================================
              // GLASS PAW PRINT & TAP RIPPLE EFFECT
              // =========================================================================
              private class PawPrintEffect(
                  val x: Float,
                  val y: Float,
                  val angle: Float,
                  val isGinger: Boolean
              ) {
                  var life = 2.6f
                  private val maxLife = 2.6f

                  fun draw(canvas: Canvas, paint: Paint, ringPaint: Paint, scale: Float) {
                      val alphaRatio = (life / maxLife).coerceIn(0f, 1f)
                      val alpha = (alphaRatio * 115).toInt()
                      val rippleProgress = 1f - alphaRatio

                      ringPaint.style = Paint.Style.STROKE
                      ringPaint.strokeWidth = 2.5f * scale
                      ringPaint.color = Color.argb((alpha * 0.75f).toInt(), 255, 255, 255)
                      canvas.drawCircle(x, y, (14f + rippleProgress * 36f) * scale, ringPaint)

                      canvas.save()
                      canvas.translate(x, y)
                      canvas.rotate(Math.toDegrees(angle.toDouble()).toFloat())
                      canvas.scale(scale, scale)

                      paint.color = if (isGinger) {
                          Color.argb(alpha, 255, 190, 175)
                      } else {
                          Color.argb(alpha, 225, 215, 220)
                      }

                      canvas.drawOval(RectF(-7.5f, -6.5f, 3.5f, 6.5f), paint)
                      canvas.drawCircle(7.5f, -7f, 2.7f, paint)
                      canvas.drawCircle(10f, -2.4f, 2.7f, paint)
                      canvas.drawCircle(10f, 2.4f, 2.7f, paint)
                      canvas.drawCircle(7.5f, 7f, 2.7f, paint)

                      canvas.restore()
                  }
              }

              // =========================================================================
              // RED YARN BALL FOR PLAYFUL CHASING
              // =========================================================================
              private class YarnBall(var x: Float, var y: Float) {
                  var vx = 70f
                  var vy = -50f
                  var spin = 0f

                  fun update(dt: Float, w: Float, h: Float, active: Boolean, scale: Float) {
                      if (!active) return
                      x += vx * dt
                      y += vy * dt
                      vx *= 0.985f
                      vy *= 0.985f
                      spin += hypot(vx, vy) * dt * 0.04f

                      val margin = 80f * scale
                      if (x < margin) { x = margin; vx = abs(vx) }
                      if (x > w - margin) { x = w - margin; vx = -abs(vx) }
                      if (y < margin + 90f) { y = margin + 90f; vy = abs(vy) }
                      if (y > h - margin - 90f) { y = h - margin - 90f; vy = -abs(vy) }
                  }

                  fun bat(fromX: Float, fromY: Float, speedMult: Float) {
                      val ang = atan2(y - fromY, x - fromX) + (Random.nextFloat() - 0.5f) * 0.6f
                      val impulse = 360f * speedMult
                      vx = cos(ang) * impulse
                      vy = sin(ang) * impulse
                  }

                  fun draw(canvas: Canvas, paint: Paint, linePaint: Paint, shadowPaint: Paint, scale: Float) {
                      canvas.save()
                      canvas.translate(x, y)
                      canvas.scale(scale, scale)

                      canvas.drawCircle(8f, 12f, 18f, shadowPaint)

                      linePaint.style = Paint.Style.STROKE
                      linePaint.strokeWidth = 3f
                      linePaint.color = Color.rgb(225, 29, 72)
                      val threadPath = Path()
                      threadPath.moveTo(0f, 12f)
                      threadPath.quadTo(-25f, 26f + sin(spin) * 8f, -52f, 16f - cos(spin) * 10f)
                      canvas.drawPath(threadPath, linePaint)

                      canvas.rotate(Math.toDegrees(spin.toDouble()).toFloat())
                      paint.color = Color.rgb(225, 29, 72)
                      canvas.drawCircle(0f, 0f, 18f, paint)

                      linePaint.strokeWidth = 2.2f
                      linePaint.color = Color.rgb(253, 164, 175)
                      canvas.drawArc(RectF(-15f, -15f, 15f, 15f), 20f, 140f, false, linePaint)
                      canvas.drawArc(RectF(-12f, -16f, 12f, 16f), 110f, 150f, false, linePaint)
                      canvas.drawArc(RectF(-16f, -10f, 16f, 10f), 200f, 140f, false, linePaint)

                      canvas.restore()
                  }
              }

              // =========================================================================
              // SINGLE LARGE REALISTIC CAT (Detailed Fur Coat, Anatomy & Mischief)
              // =========================================================================
              private class LargeRealisticCat(screenW: Float, screenH: Float, var breed: CatBreed) {
                  var x = screenW * 0.5f
                  var y = screenH * 0.55f
                  var angle = Random.nextFloat() * (2f * PI.toFloat())
                  var targetAngle = angle

                  var walkPhase = 0f
                  var tailPhase = 0f
                  var actionPhase = 0f
                  var earTwitchPhase = 0f
                  var breathPhase = 0f
                  var blinkTimer = 2.5f
                  var isBlinking = false

                  var mischief = CatMischief.STROLLING
                  var stateTimer = 3.2f
                  var swipeCooldown = 0f
                  var jumpHeight = 0f

                  fun update(
                      dt: Float,
                      w: Float,
                      h: Float,
                      scale: Float,
                      speedMult: Float,
                      yarn: YarnBall?,
                      onPawGlass: (Float, Float, Float, Boolean) -> Unit
                  ) {
                      stateTimer -= dt
                      swipeCooldown -= dt
                      actionPhase += dt * (7.2f * speedMult)
                      earTwitchPhase += dt * 3.0f
                      tailPhase += dt * (4.0f * speedMult)
                      breathPhase += dt * 2.8f

                      // Natural eye blinking
                      blinkTimer -= dt
                      if (blinkTimer <= 0f) {
                          if (!isBlinking) {
                              isBlinking = true
                              blinkTimer = 0.15f
                          } else {
                              isBlinking = false
                              blinkTimer = Random.nextFloat() * 3.8f + 1.8f
                          }
                      }

                      // Switch smoothly between realistic behaviors & mischief
                      if (stateTimer <= 0f) {
                          val roll = Random.nextFloat()
                          mischief = when {
                              roll < 0.28f -> CatMischief.CHASING_YARN
                              roll < 0.52f -> CatMischief.PAWING_GLASS
                              roll < 0.72f -> CatMischief.PLAYFUL_ROLL
                              roll < 0.85f -> CatMischief.SITTING_GROOM
                              else -> CatMischief.STROLLING
                          }
                          stateTimer = when (mischief) {
                              CatMischief.PAWING_GLASS -> Random.nextFloat() * 2.5f + 2.2f
                              CatMischief.PLAYFUL_ROLL -> Random.nextFloat() * 2.6f + 2.2f
                              CatMischief.SITTING_GROOM -> Random.nextFloat() * 2.4f + 2.0f
                              CatMischief.CHASING_YARN -> Random.nextFloat() * 4.5f + 3.5f
                              CatMischief.STROLLING -> Random.nextFloat() * 4.2f + 3.0f
                          }
                          if (mischief == CatMischief.STROLLING) {
                              targetAngle += (Random.nextFloat() - 0.5f) * 2.4f
                          }
                      }

                      jumpHeight = 0f
                      var moveSpeed = 0f

                      when (mischief) {
                          CatMischief.STROLLING -> {
                              moveSpeed = 98f * speedMult
                          }

                          CatMischief.PAWING_GLASS -> {
                              moveSpeed = 0f
                              if (swipeCooldown <= 0f) {
                                  swipeCooldown = 0.65f
                                  val side = if (sin(actionPhase) >= 0f) 1f else -1f
                                  val perp = angle + (PI.toFloat() / 2f)
                                  val pawX = x + cos(angle) * (72f * scale) + cos(perp) * (18f * side * scale)
                                  val pawY = y + sin(angle) * (72f * scale) + sin(perp) * (18f * side * scale)
                                  onPawGlass(pawX, pawY, angle, breed == CatBreed.FLUFFY_CREAM_GINGER)
                              }
                          }

                          CatMischief.CHASING_YARN -> {
                              if (yarn != null) {
                                  val dx = yarn.x - x
                                  val dy = yarn.y - y
                                  val dist = hypot(dx.toDouble(), dy.toDouble()).toFloat()
                                  targetAngle = atan2(dy, dx)
                                  moveSpeed = 165f * speedMult
                                  if (dist < 82f * scale && swipeCooldown <= 0f) {
                                      swipeCooldown = 0.55f
                                      yarn.bat(x, y, speedMult)
                                      jumpHeight = 15f * scale
                                  }
                              } else {
                                  mischief = CatMischief.STROLLING
                              }
                          }

                          CatMischief.PLAYFUL_ROLL -> {
                              moveSpeed = 0f
                              angle += sin(actionPhase * 1.3f) * 0.042f
                          }

                          CatMischief.SITTING_GROOM -> {
                              moveSpeed = 0f
                          }
                      }

                      // Keep large cat well inside screen borders
                      val margin = 175f * scale
                      if (x < margin || x > w - margin || y < margin + 90f || y > h - margin - 90f) {
                          targetAngle = atan2(h * 0.5f - y, w * 0.5f - x) + (Random.nextFloat() - 0.5f) * 0.35f
                          if (mischief != CatMischief.STROLLING && mischief != CatMischief.CHASING_YARN) {
                              mischief = CatMischief.STROLLING
                          }
                      }

                      var diff = targetAngle - angle
                      while (diff > PI) diff -= (2f * PI).toFloat()
                      while (diff < -PI) diff += (2f * PI).toFloat()
                      angle += diff * (3.0f * dt)

                      if (moveSpeed > 0f) {
                          walkPhase += dt * (moveSpeed / (14f * scale))
                          x += cos(angle) * moveSpeed * dt
                          y += sin(angle) * moveSpeed * dt
                      } else {
                          walkPhase += dt * 1.4f
                      }
                  }

                  fun draw(
                      canvas: Canvas,
                      bodyPaint: Paint,
                      furPaint: Paint,
                      shadowPaint: Paint,
                      detailPaint: Paint,
                      scale: Float
                  ) {
                      canvas.save()
                      canvas.translate(x, y - jumpHeight)
                      canvas.rotate(Math.toDegrees(angle.toDouble()).toFloat())
                      canvas.scale(scale, scale)

                      val isFluffyCream = (breed == CatBreed.FLUFFY_CREAM_GINGER)

                      val furMain = if (isFluffyCream) Color.rgb(238, 178, 114) else Color.rgb(104, 86, 68)
                      val furDark = if (isFluffyCream) Color.rgb(205, 134, 68) else Color.rgb(42, 34, 28)
                      val furWhite = if (isFluffyCream) Color.rgb(252, 249, 244) else Color.rgb(245, 243, 238)

                      val isRolling = (mischief == CatMischief.PLAYFUL_ROLL)
                      val isCompact = (mischief == CatMischief.PAWING_GLASS || mischief == CatMischief.SITTING_GROOM)
                      val bodyStretch = if (isCompact) 0.85f else if (isRolling) 0.92f else 1.0f
                      val breathScale = 1f + sin(breathPhase) * 0.022f

                      // 1. Soft 3D Ground Shadow beneath the large cat
                      canvas.save()
                      canvas.translate(18f, 26f + (jumpHeight / scale))
                      canvas.drawOval(RectF(-74f * bodyStretch, -38f, 58f, 38f), shadowPaint)
                      canvas.restore()

                      // 2. Bushy / Striped Tail
                      drawCatTail(canvas, detailPaint, furMain, furDark, furWhite, bodyStretch, isFluffyCream)

                      // 3. Four Realistic Paws
                      drawCatPaws(canvas, bodyPaint, furPaint, furMain, furWhite, bodyStretch)

                      // 4. Torso with Realistic Fur Coat
                      val halfW = (if (isFluffyCream) 35f else 30f) * breathScale
                      val torsoRect = RectF(-68f * bodyStretch, -halfW, 46f, halfW)

                      if (isFluffyCream) {
                          furPaint.color = Color.argb(145, 246, 212, 168)
                          for (tStep in -60..38 step 11) {
                              val ruff = sin(tStep * 0.4f + walkPhase) * 3.2f
                              canvas.drawCircle(tStep.toFloat(), -halfW - 2.5f + ruff, 13f, furPaint)
                              canvas.drawCircle(tStep.toFloat(), halfW + 2.5f - ruff, 13f, furPaint)
                          }
                      }

                      bodyPaint.color = furMain
                      canvas.drawRoundRect(torsoRect, 32f, 32f, bodyPaint)

                      canvas.save()
                      val torsoPath = Path().apply { addRoundRect(torsoRect, 32f, 32f, Path.Direction.CW) }
                      canvas.clipPath(torsoPath)

                      if (isRolling) {
                          furPaint.color = furWhite
                          canvas.drawOval(RectF(-46f, -22f, 40f, 22f), furPaint)
                      } else if (isFluffyCream) {
                          furPaint.color = furWhite
                          canvas.drawCircle(38f, 0f, 30f, furPaint)
                          canvas.drawCircle(25f, -17f, 19f, furPaint)
                          canvas.drawCircle(25f, 17f, 19f, furPaint)
                          detailPaint.style = Paint.Style.STROKE
                          detailPaint.strokeWidth = 5.2f
                          detailPaint.color = Color.argb(95, 205, 134, 68)
                          for (sx in listOf(-42f, -24f, -6f)) {
                              canvas.drawLine(sx, -30f, sx - 6f, -10f, detailPaint)
                              canvas.drawLine(sx, 30f, sx - 6f, 10f, detailPaint)
                          }
                      } else {
                          furPaint.color = furWhite
                          canvas.drawCircle(40f, 0f, 20f, furPaint)

                          detailPaint.style = Paint.Style.STROKE
                          detailPaint.strokeWidth = 5.5f
                          detailPaint.strokeCap = Paint.Cap.ROUND
                          detailPaint.color = furDark
                          canvas.drawLine(-58f, 0f, 22f, 0f, detailPaint)
                          for (sx in listOf(-48f, -32f, -16f, 0f, 16f)) {
                              canvas.drawLine(sx, -28f, sx - 8f, -5f, detailPaint)
                              canvas.drawLine(sx, 28f, sx - 8f, 5f, detailPaint)
                          }
                      }
                      canvas.restore()

                      // 5. Realistic Feline Head (Ear tufts, white muzzle, M-forehead, whiskers, eyes)
                      drawCatHead(canvas, bodyPaint, furPaint, detailPaint, furMain, furDark, furWhite, isFluffyCream)

                      canvas.restore()
                  }

                  private fun drawCatTail(
                      canvas: Canvas,
                      detailPaint: Paint,
                      furMain: Int,
                      furDark: Int,
                      furWhite: Int,
                      bodyStretch: Float,
                      isFluffyCream: Boolean
                  ) {
                      val baseTailX = -64f * bodyStretch
                      val wagAmp = if (mischief == CatMischief.PLAYFUL_ROLL || mischief == CatMischief.PAWING_GLASS) 26f else 17f
                      val sway1 = sin(tailPhase) * wagAmp
                      val sway2 = sin(tailPhase - 1.2f) * (wagAmp * 1.45f)

                      val tailPath = Path()
                      tailPath.moveTo(baseTailX, 0f)
                      tailPath.cubicTo(
                          baseTailX - 38f, sway1 * 0.7f,
                          baseTailX - 75f, sway2,
                          baseTailX - 106f, sway2 * 1.15f
                      )

                      detailPaint.style = Paint.Style.STROKE
                      detailPaint.strokeCap = Paint.Cap.ROUND

                      if (isFluffyCream) {
                          detailPaint.strokeWidth = 18f
                          detailPaint.color = Color.argb(160, 246, 212, 168)
                          canvas.drawPath(tailPath, detailPaint)
                          detailPaint.strokeWidth = 13f
                          detailPaint.color = furMain
                          canvas.drawPath(tailPath, detailPaint)
                          detailPaint.strokeWidth = 11.5f
                          detailPaint.color = furWhite
                          canvas.drawCircle(baseTailX - 106f, sway2 * 1.15f, 6.2f, detailPaint)
                      } else {
                          detailPaint.strokeWidth = 12f
                          detailPaint.color = furMain
                          canvas.drawPath(tailPath, detailPaint)
                          detailPaint.strokeWidth = 12f
                          detailPaint.color = furDark
                          canvas.drawCircle(baseTailX - 46f, sway1 * 0.85f, 4.2f, detailPaint)
                          canvas.drawCircle(baseTailX - 80f, sway2 * 1.05f, 4.2f, detailPaint)
                          canvas.drawCircle(baseTailX - 106f, sway2 * 1.15f, 4.8f, detailPaint)
                      }
                  }

                  private fun drawCatPaws(
                      canvas: Canvas,
                      bodyPaint: Paint,
                      furPaint: Paint,
                      furMain: Int,
                      furWhite: Int,
                      bodyStretch: Float
                  ) {
                      if (mischief == CatMischief.PAWING_GLASS) {
                          val leftSwipe = max(0f, sin(actionPhase)) * 28f
                          val rightSwipe = max(0f, sin(actionPhase + PI.toFloat())) * 28f

                          val paws = listOf(
                              Pair(44f + leftSwipe, -19f),
                              Pair(44f + rightSwipe, 19f),
                              Pair(-46f * bodyStretch, -28f),
                              Pair(-46f * bodyStretch, 28f)
                          )
                          for ((px, py) in paws) {
                              bodyPaint.color = furMain
                              canvas.drawOval(RectF(px - 12f, py - 8f, px + 14f, py + 8f), bodyPaint)
                              furPaint.color = furWhite
                              canvas.drawCircle(px + 9f, py, 6.2f, furPaint)
                          }
                          return
                      }

                      if (mischief == CatMischief.PLAYFUL_ROLL) {
                          val wiggle = sin(actionPhase * 1.6f) * 5.5f
                          val paws = listOf(
                              Pair(28f, -25f + wiggle),
                              Pair(28f, 25f - wiggle),
                              Pair(-34f, -25f - wiggle),
                              Pair(-34f, 25f + wiggle)
                          )
                          for ((px, py) in paws) {
                              furPaint.color = furWhite
                              canvas.drawCircle(px, py, 9.5f, furPaint)
                              furPaint.color = Color.rgb(244, 143, 165)
                              canvas.drawCircle(px, py, 4f, furPaint)
                          }
                          return
                      }

                      val stride = if (mischief == CatMischief.SITTING_GROOM) 0f else 16f
                      val flOffset = sin(walkPhase) * stride
                      val frOffset = sin(walkPhase + PI.toFloat()) * stride
                      val blOffset = sin(walkPhase + PI.toFloat()) * stride
                      val brOffset = sin(walkPhase) * stride

                      val pawPositions = listOf(
                          Pair(34f + flOffset, -28f),
                          Pair(34f + frOffset, 28f),
                          Pair(-46f * bodyStretch + blOffset, -29f),
                          Pair(-46f * bodyStretch + brOffset, 29f)
                      )

                      for ((px, py) in pawPositions) {
                          bodyPaint.color = furMain
                          canvas.drawOval(RectF(px - 11.5f, py - 8f, px + 14.5f, py + 8f), bodyPaint)
                          furPaint.color = furWhite
                          canvas.drawCircle(px + 9f, py, 6f, furPaint)
                      }
                  }

                  private fun drawCatHead(
                      canvas: Canvas,
                      bodyPaint: Paint,
                      furPaint: Paint,
                      detailPaint: Paint,
                      furMain: Int,
                      furDark: Int,
                      furWhite: Int,
                      isFluffyCream: Boolean
                  ) {
                      val headX = 50f
                      val headTurn = when (mischief) {
                          CatMischief.PAWING_GLASS -> sin(actionPhase * 0.7f) * 10f
                          CatMischief.PLAYFUL_ROLL -> sin(actionPhase) * 15f
                          CatMischief.SITTING_GROOM -> sin(breathPhase * 0.8f) * 8f
                          else -> sin(walkPhase * 0.5f) * 4f
                      }

                      canvas.save()
                      canvas.translate(headX, 0f)
                      canvas.rotate(headTurn)

                      val twitch = max(0f, sin(earTwitchPhase * 3f)) * 4.5f
                      for (side in listOf(-1f, 1f)) {
                          val earTipX = -16f - (if (side < 0) twitch else 0f)
                          val earTipY = side * 34f

                          val earPath = Path()
                          earPath.moveTo(-4f, side * 12f)
                          earPath.lineTo(earTipX, earTipY)
                          earPath.lineTo(12f, side * 23f)
                          earPath.close()

                          bodyPaint.color = furMain
                          canvas.drawPath(earPath, bodyPaint)

                          val innerEar = Path()
                          innerEar.moveTo(-3f, side * 15f)
                          innerEar.lineTo(earTipX + 4f, earTipY - side * 4f)
                          innerEar.lineTo(7f, side * 22f)
                          innerEar.close()
                          furPaint.color = if (isFluffyCream) Color.rgb(252, 214, 210) else Color.rgb(228, 172, 178)
                          canvas.drawPath(innerEar, furPaint)

                          if (isFluffyCream) {
                              detailPaint.style = Paint.Style.STROKE
                              detailPaint.strokeWidth = 1.7f
                              detailPaint.color = furWhite
                              canvas.drawLine(earTipX, earTipY, earTipX - 6.5f, earTipY + side * 6.5f, detailPaint)
                              canvas.drawLine(earTipX + 2f, earTipY, earTipX - 4.5f, earTipY + side * 7.5f, detailPaint)
                          }
                      }

                      if (isFluffyCream) {
                          furPaint.color = furWhite
                          canvas.drawCircle(-2f, -20f, 13f, furPaint)
                          canvas.drawCircle(-2f, 20f, 13f, furPaint)
                      }

                      bodyPaint.color = furMain
                      canvas.drawOval(RectF(-22f, -25f, 26f, 25f), bodyPaint)

                      if (isFluffyCream) {
                          furPaint.color = furWhite
                          canvas.drawOval(RectF(6f, -6f, 25f, 6f), furPaint)
                          canvas.drawOval(RectF(12f, -14f, 29f, 14f), furPaint)
                      } else {
                          detailPaint.style = Paint.Style.STROKE
                          detailPaint.strokeWidth = 2.4f
                          detailPaint.color = furDark
                          canvas.drawLine(-4f, -8.5f, 4.5f, -4.5f, detailPaint)
                          canvas.drawLine(4.5f, -4.5f, -2f, 0f, detailPaint)
                          canvas.drawLine(-2f, 0f, 4.5f, 4.5f, detailPaint)
                          canvas.drawLine(4.5f, 4.5f, -4f, 8.5f, detailPaint)

                          furPaint.color = furWhite
                          canvas.drawOval(RectF(14f, -11.5f, 29f, 11.5f), furPaint)
                      }

                      // Realistic Pink Nose
                      furPaint.color = Color.rgb(225, 118, 122)
                      canvas.drawCircle(26f, 0f, 3.8f, furPaint)

                      // Realistic Cat Eyes with vertical slit pupils
                      val eyeColor = if (isFluffyCream) Color.rgb(218, 152, 34) else Color.rgb(186, 196, 56)

                      for (side in listOf(-1f, 1f)) {
                          val eyeX = 11.5f
                          val eyeY = side * 11f
                          if (!isBlinking) {
                              furPaint.color = eyeColor
                              canvas.drawOval(RectF(eyeX - 4.6f, eyeY - 5.2f, eyeX + 4.6f, eyeY + 5.2f), furPaint)
                              furPaint.color = Color.rgb(15, 23, 42)
                              canvas.drawOval(RectF(eyeX - 2.9f, eyeY - 1.6f, eyeX + 2.9f, eyeY + 1.6f), furPaint)
                              furPaint.color = Color.WHITE
                              canvas.drawCircle(eyeX + 1.6f, eyeY - 1.6f, 1.5f, furPaint)
                          } else {
                              detailPaint.style = Paint.Style.STROKE
                              detailPaint.strokeWidth = 2.3f
                              detailPaint.color = furDark
                              canvas.drawLine(eyeX, eyeY - 4.2f, eyeX, eyeY + 4.2f, detailPaint)
                          }
                      }

                      // Long White Whiskers
                      detailPaint.style = Paint.Style.STROKE
                      detailPaint.strokeWidth = 1.6f
                      detailPaint.color = Color.argb(235, 255, 255, 255)
                      for (side in listOf(-1f, 1f)) {
                          canvas.drawLine(21f, side * 6f, 14f, side * 33f, detailPaint)
                          canvas.drawLine(23f, side * 5f, 24f, side * 32f, detailPaint)
                          canvas.drawLine(19f, side * 7f, 7f, side * 29f, detailPaint)
                      }

                      canvas.restore()
                  }
              }
          }
          EOF

      - name: Initialize Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Large-Realistic-Cat-Overlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
